<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@500&family=Poppins&family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: hsl(0, 0%, 8%);
    }

    .container {
      background-color: hsl(0, 0%, 12%);
      border-radius: 15px;
      max-width: 350px;
      padding: 32px;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .social-links a {
      background-color: hsl(0, 0%, 20%);
      display: inline-block;
      border: none;
      padding: 10px;
      border-radius: 10px;
      width: 100%;

      text-align: center;

      font-size: 14px;

    }

    .social-links a:hover {
      background-color: hsl(75, 94%, 57%);
      cursor: pointer;
    }

    .social-links a {
      text-decoration: none;
      color: hsl(0, 0%, 100%);
      font-weight: 700;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: hsl(0, 0%, 100%);
    }

    .profile-card img {
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin-bottom: 10px;
    }

    .profile-card h2 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      font-weight: 400;
    }

    .profile-card p {
      font-size: 0.875rem;
      margin-bottom: 10px;
    }



    .location {
      color: hsl(75, 94%, 57%);
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="profile-card">

      <img src="./assets/images/avatar-jessica.jpeg" alt="Profile picture of Jessica Randall" class="profile-picture">
      <h2>Jessica Randall</h2>
      <p class="location"> London, United Kingdom</p>
      <p class="bio">"Front-end developer and avid reader."</p>
    </div>
    <div class="social-links">
      <a href="https://github.com/jessicarandall" target="_blank">GitHub</a>
      <a href="https://www.frontendmentor.io/profile/jessicarandall" target="_blank">Frontend
        Mentor</a>
      <a href="https://www.linkedin.com/in/jessicarandall" target="_blank">LinkedIn</a>
      <a href="https://twitter.com/jessicarandall" target="_blank">Twitter</a>
      <a href="https://www.instagram.com/jessicarandall" target="_blank">Instagram</a>

    </div>
  </div>
</body>

</html>
