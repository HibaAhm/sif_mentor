<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@500&family=Poppins&family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: hsl(221, 100%, 96%);
      font-size: 18px;

    }

    .container {
      display: flex;
      flex-direction: row;
      width: 600px;
      height: 400px;
      background-color: hsl(0, 0%, 100%);
      border-radius: 20px;

    }



    .summary {
      width: 50%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;

    }

    .summary h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: rgb(48, 30, 96);
    }

    .category_reaction,
    .category_memory,
    .category_verbal,
    .category_visual {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-radius: 15px;
      padding: 10px;
      margin: 10px 0;
    }

    .category-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    .category_reaction {
      background-color: hsl(0, 100%, 67%, 0.1);

    }

    .category_memory {
      background-color: hsl(39, 100%, 56%, 0.1);

    }

    .category_verbal {
      background-color: hsl(166, 100%, 37%, 0.1);

    }

    .category_visual {
      background-color: hsl(234, 85%, 45%, 0.1);
      ;
    }

    .visual_description {
      color: hsla(256, 72%, 46%, 1);
    }

    .reaction_description {
      color: hsl(0, 100%, 67%);
    }

    .memory_description {
      color: hsl(39, 100%, 56%);
    }

    .verbal_description {
      color: hsl(166, 100%, 37%);
    }

    button {
      width: 100%;
      padding: 15px;
      background-color: hsl(224, 30%, 27%);
      color: hsl(0, 0%, 100%);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: linear-gradient(to bottom,
          hsl(252, 100%, 67%),
          hsl(241, 81%, 54%));
    }

    span {
      color: hsl(240, 12%, 55%);

    }

    strong {
      color: hsl(224, 30%, 27%);
    }

    .results-summary {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 50%;
      background: linear-gradient(to bottom,
          hsl(252, 100%, 67%),

          hsl(241, 81%, 54%));
      border-radius: 20px;
      color: hsl(0, 0%, 100%);
    }

    .results-summary h1 {
      font-size: 1.5rem;
      margin: 20px;
      color: hsl(241, 100%, 89%);
    }

    .score {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;

      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(to bottom, hsla(256, 72%, 46%, 1), hsl(241, 81%, 54%, 0.1));
      box-shadow: inset 0px 10px 20px hsla(241, 81%, 54%, 0.1);
    }

    .score-number {
      font-size: 3rem;
      font-weight: 700;

    }

    .score-total {
      color: hsl(241, 100%, 89%, 0.8);

    }

    .score-title {
      font-size: 1.5rem;
      margin: 10px 0;

    }

    .score-detail {
      text-align: center;
      width: 80%;
      color: hsl(241, 100%, 89%, 0.8);
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="results-summary">
      <h1>Your Result</h1>
      <div class="score">
        <p class="score-number">76</p>
        <p class="score-total">of 100</p>
      </div>
      <h2 class="score-title">Great</h2>
      <p class="score-detail">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="summary">
      <h2>Summary</h2>
      <div class="category_reaction">
        <div class="category-name">
          <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
          <p class="reaction_description">Reaction</p>
        </div>
        <p class="category_score"><strong>80</strong> <span>/ 100</span></p>
      </div>


      <div class="category_memory">
        <div class="category-name">
          <img src="./assets/images/icon-memory.svg" alt="memory icon">
          <p class="memory_description">Memory</p>
        </div>
        <p class="category_score"><strong>92</strong> <span>/ 100</span></p>
      </div>


      <div class="category_verbal">
        <div class="category-name">
          <img src="./assets/images/icon-verbal.svg" alt="verbal icon">
          <p class="verbal_description">Verbal</p>
        </div>
        <p class="category_score"><strong>61</strong> <span>/ 100</span></p>
      </div>
      <div class="category_visual">
        <div class="category-name">
          <img src="./assets/images/icon-visual.svg" alt="visual icon">
          <p class="visual_description">Visual</p>
        </div>
        <p class="category_score"><strong>73</strong> <span>/ 100</span></p>
      </div>
      <button>Continue</button>
    </div>

  </div>

</body>

</html>
